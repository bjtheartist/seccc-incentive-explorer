name: Zoning source refresh

# City Clerk eLMS, the current ArcGIS zoning map, and the City ZBA case layer
# are checked daily. A source change opens a review PR; it never merges directly
# into production.

on:
  schedule:
    - cron: "20 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zoning-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh official zoning sources
        run: npm run data:sync:zoning

      - name: Detect source changes
        id: diff
        run: |
          if git diff --quiet -- data/curated/zoning; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No official-source change detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/curated/zoning
          fi

      - name: Verify zoning contracts
        if: steps.diff.outputs.changed == 'true'
        run: npm test -- lib/__tests__/zoning-legislation.test.ts lib/__tests__/chicago-zba.test.ts lib/__tests__/zoning-source-artifacts.test.ts app/api/zoning/legislation/route.test.ts

      # Permit History Exhibit "Archive" (rides with its evidence-spine PR):
      # dates and hashes today's zoning-map-snapshot.json under
      # data/archive/zoning/ so the exhibit's S3 boundary context can state
      # what vintage range of archived boundaries exists. Makes no new City
      # API calls — see scripts/archive-zoning-snapshot.ts's own doc comment
      # for the full size/format judgment call.
      - name: Archive zoning snapshot
        if: steps.diff.outputs.changed == 'true'
        run: npm run data:archive:zoning

      - name: Open source-review PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BRANCH="chore/zoning-source-refresh-$DATE"
          BODY="$RUNNER_TEMP/zoning-refresh-pr.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add data/curated/zoning
          git commit -m "chore(data): refresh official zoning sources ($DATE)"
          git push --force origin "$BRANCH"

          {
            echo "Daily review snapshot from the Chicago City Clerk eLMS, City ArcGIS zoning layer, and City ZBA case layer."
            echo
            echo "This PR does not merge itself. Review the legislative lifecycle and map-delta files before accepting the source change."
            echo
            echo "## Review boundary"
            echo "- eLMS activity is legislation, not current parcel geometry."
            echo "- Pending legislation is not a mapped zoning change."
            echo "- ZBA records are historical source records, not current authorization findings."
            echo "- The City ZBA layer does not publish a refresh timestamp; retrieval time is not substituted."
            echo "- No permitted-use conclusion is generated by this refresh."
            echo
            echo "## Changed artifacts"
            echo '```'
            git diff --stat "$BASE_BRANCH...HEAD" -- data/curated/zoning
            echo '```'
          } > "$BODY"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --title "chore(data): zoning source refresh $DATE" --body-file "$BODY"
          else
            gh pr create --title "chore(data): zoning source refresh $DATE" --body-file "$BODY" --base "$BASE_BRANCH" --head "$BRANCH"
          fi
