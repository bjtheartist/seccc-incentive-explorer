name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Read-only gate: the committed input manifest must still describe the
      # files on disk. A stale manifest is what broke the 2026-09-02 monthly
      # refresh (fixed by #260); running it here means it can never merge, or
      # sit on main, unnoticed. .github/workflows/manifest-drift.yml runs the
      # same script weekly against main.
      - name: Verify the investment input manifest
        run: npm run data:manifest:verify

      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build -- --webpack

  e2e:
    runs-on: ubuntu-latest
    # Separate job from `verify` so unit CI speed is unaffected — this job
    # builds and boots the whole app plus a real Chromium, which is a lot
    # slower than the vitest/lint/tsc steps above. Runs in parallel with
    # `verify` (no `needs:`), not after it.
    timeout-minutes: 20
    env:
      # Map pages (Mapbox GL) and any route that reads live data need these
      # at build/runtime. NEXT_PUBLIC_MAPBOX_TOKEN is a client-exposed
      # token by design (Next.js inlines NEXT_PUBLIC_* into the browser
      # bundle) — safe as a repo secret. DATABASE_URL is a normal Neon
      # Postgres connection string; both must be added under
      # Settings -> Secrets and variables -> Actions for this job to
      # exercise real map/data content. Until they're added, the job still
      # runs (build/start never hard-require these — see lib/db.ts's
      # lazy getSQL()), but any spec that depends on live map tiles or
      # DB-backed routes will fail on that missing data, not on infra.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build -- --webpack

      - name: Start server
        run: npm run start &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond on :3000 within 60s" >&2
          exit 1

      - name: Run e2e tests (chromium only)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-smoke:
    runs-on: ubuntu-latest
    # A focused second engine lane: five Mobile Safari/WebKit checks and
    # three lightweight Firefox checks. It runs beside, not inside, the
    # existing 28-test Chromium gate.
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's WebKit and Firefox
        run: npx playwright install --with-deps webkit firefox

      - name: Build
        run: npm run build -- --webpack

      - name: Start server
        run: npm run start &

      - name: Wait for server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/ -o /dev/null; then
              echo "Server is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond on :3000 within 60s" >&2
          exit 1

      - name: Run focused WebKit and Firefox smoke tests
        run: npm run test:e2e:browsers

      - name: Upload cross-browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7
